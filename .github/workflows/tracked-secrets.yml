name: Guard tracked credentials

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-tracked-filenames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked environment and signing files
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, sys
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          bad = []
          for path in filter(None, files):
              name = pathlib.PurePosixPath(path).name.lower()
              if name.startswith('.env') and name not in ('.env.example', '.env.sample', '.env.template'):
                  bad.append(path)
              if name.endswith(('.keystore', '.jks', '.p12', '.pfx', '.pem')):
                  bad.append(path)
          gitignore = pathlib.Path('.gitignore').read_text(encoding='utf-8')
          if any(line.startswith(('<<<<<<< ', '>>>>>>> ')) or line == '=======' for line in gitignore.splitlines()):
              bad.append('.gitignore (merge conflict markers)')
          if bad:
              print('Tracked private-looking files or merge-conflict markers detected:')
              for path in sorted(set(bad)):
                  print(' - ' + path)
              sys.exit(1)
          print('No sensitive filenames tracked in the current checkout.')
          PY
